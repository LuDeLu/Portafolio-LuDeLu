<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LuDeLu">
  <title>LuDeLu</title>
  <!-- Two L's in 180° rotational symmetry: the repeated "Lu" of LuDeLu.
       The 4px channel between them keeps both readable in a single colour. -->
  <path d="M4,4 h12 v22 h14 v12 H4 Z" fill="#E2C6F7"/>
  <path d="M60,60 h-12 v-22 h-14 v-12 H60 Z" fill="#6F2DBD"/>
</svg>
